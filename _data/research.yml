- title: "Is That the Way? Tourism-Driven Social Change and the Decline of Local Participation"
  abstract: "[AVAILABLE UPON REQUEST] Tourism is generally praised for revitalizing local economies, yet it can also carry subtle political costs. In this article, I argue that contexts of persistent mobility, where social encounters are frequent but ephemeral, weaken the incentives to invest and to enforce local participation. I examine the case of the Way of Saint James (Camino de Santiago) in Spain, where a tourist boom transformed social life in small urban and rural communities. Using a difference-in-differences strategy, I show that tourist exposure reduced association density by roughly 25 percent of the sample mean and local turnout by more than 2 percentage points. Communities that host pilgrims face a contextual and compositional shock. First, hostels tend to be located near town halls, disrupting existing social routines at these fixed places. Second, hostels attract younger, mobile residents who join the community and have less engagement in local affairs. Both effects changed the norms that enforce local participation. "
  pdf: "/assets/papers/jms_manuscript.pdf"

- title: "Bordering on Discontent: The Political Consequences of Border Liberalization"
  authors:
    - name: "Josep Serrano-Serrat"
      url: "https://sites.google.com/view/j-serrano-serrat/about-me?authuser=0"
  abstract: "In the aftermath of globalization, Western democracies have seen rising political disaffection and growing support for radical-right parties. Research has examined the consequences of immigration extensively, but the effects of policies that merely ease cross-border mobility remain underexplored. Drawing on political geography and social psychology, we argue that greater border permeability can generate political discontent even without heightened immigration or meaningful economic change. How that discontent is electorally expressed depends on political supply. Absent a radical-right party, it manifests as disengagement –– lower turnout and declining mainstream support. When such a party is present, it can be mobilized electorally. We study the German--Czech border, exploiting the Czech Republic's 2004 EU accession, which eased mobility without granting settlement rights, and the AfD's programmatic shift in 2015. Using difference-in-differences and event-study designs on German electoral data, we find demobilization as the primary response, with radical-right mobilization emerging only later."
  link: "https://osf.io/preprints/socarxiv/t6fhm_v2"

